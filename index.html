<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>star.art - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="logo">colocar logo</div>

  <div class="caixa">
    <img class="icone-voltar" src="assets/seta_voltar.png" alt="Voltar" onclick="history.back()">

    <h2>Faça login</h2>

    <label for="email">Email*</label>
    <input type="email" id="email" placeholder="seuemail@.com" oninput="verificarCampos()">

    <label for="senha">Senha*</label>
    <input type="password" id="senha" placeholder="suasenha1234" oninput="verificarCampos()">

    <button id="botaoEntrar" onclick="entrar()" disabled>Entrar</button>
    <p id="mensagem"></p>

    <p class="texto">Não tem uma conta?</p>
    <a href="#" class="link">Cadastre-se agora</a>
  </div>

  <script>
    let campos = [email, senha]
    let nomes = ["email", "senha"]

    function verificarCampos() {
      let preenchido = true

      for (let i = 0; i < campos.length; i++) {
        if (campos[i].value == "") {
          preenchido = false
        }
      }

      if (preenchido == true) {
        botaoEntrar.disabled = false
      } else {
        botaoEntrar.disabled = true
      }
    }

    function entrar() {
      mensagem.style.color = "red"

      for (let i = 0; i < campos.length; i++) {
        if (campos[i].value == "") {
          mensagem.textContent = "Preencha o campo " + nomes[i]
          return
        }
      }

      if (email.value.includes("@") == false) {
        mensagem.textContent = "O email precisa ter @"
        return
      }

      if (senha.value.length < 6) {
        mensagem.textContent = "A senha precisa ter pelo menos 6 caracteres"
        return
      }

      mensagem.style.color = "green"
      mensagem.textContent = "Login feito com sucesso!"
    }
  </script>
</body>
</html>
