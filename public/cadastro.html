<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faça seu Cadastro</title>
  <link rel="icon" type="image/png" href="public/assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icon/favicon2.png">

  <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

  <aside class="lado-foto">
    <img src="assets/imgs/fndo.png" alt="Fundo com a palavra star.art repetida">
  </aside>

  <main class="lado-login">

    <!-- IMAGEM 2: logo preta (troque o link do src) -->
    <a class="logo" href="index.html">
      <img src="assets/imgs/logoblack.png" alt="star.art">
    </a>

    <section class="caixa">
      <a class="voltar" href="index.html">
        <img src="assets/imgs/iconback.png" alt="Voltar para a página inicial">
      </a>

      <h1>Faça seu cadastro</h1>

      <form action="#" method="post">

        <label for="nomeUsuario">Nome<span>*</span></label>
        <input type="text" id="nomeUsuario" name="nome" placeholder="SeuNome" required>

        <label for="email">Email<span>*</span></label>
        <input type="text" id="email" name="email" placeholder="seuemail@.com" required>

        <label for="senha">Senha<span>*</span></label>
        <input type="password" id="senha" name="senha" placeholder="suasenha1234" required>

        <button type="submit">Cadastrar</button>
      </form>

    </section>

  </main>

  <script src="js/cadastro.js"></script>

</body>

</html>
