<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faça seu login</title>
  <link rel="icon" type="image/png" href="public/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="assets/icon/favicon2.png">
</head>

<body>

  <aside class="lado-foto">
    <img src="assets/imgs/fndo.png" alt="Fundo com a palavra star.art repetida">
  </aside>

  <main class="lado-login">

    <a class="logo" href="index.html">
      <img src="assets/imgs/logoblack.png" alt="star.art">
    </a>

    <section class="caixa">
      <a class="voltar" href="index.html">
        <img src="assets/imgs/iconback.png" alt="Voltar para a página inicial">
      </a>

      <form id="formLogin" action="#" method="post" novalidate>
        <label for="email">Email<span>*</span></label>
        <input type="email" id="email" name="email" placeholder="seuemail@.com">
        <small class="erro" id="erroEmail"></small>

        <label for="senha">Senha<span>*</span></label>
        <input type="password" id="senha" name="senha" placeholder="suasenha1234">
        <small class="erro" id="erroSenha"></small>

        <small class="erro erro-geral" id="erroGeral"></small>

        <button type="submit">Entrar</button>
      </form>

      <p class="cadastro">Não tem uma conta? <a href="cadastro.html">Cadastre-se agora</a></p>
    </section>

  </main>

  <div class="loading" id="loading" hidden>
    <img src="assets/imgs/loading.gif" alt="Carregando...">
  </div>

  <script src="js/login.js"></script>

</body>

</html>
