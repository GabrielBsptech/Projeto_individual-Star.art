<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>star.art | Login</title>
  <link rel="icon" type="image/png" href="public/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <!-- IMAGEM 1: foto do lado esquerdo (troque o link do src) -->
  <aside class="lado-foto">
    <img src="" alt="Fundo com a palavra star.art repetida">
  </aside>

  <main class="lado-login">

    <!-- IMAGEM 2: logo preta (troque o link do src) -->
    <a class="logo" href="index.html">
      <img src="assets/imgs/logoblack.png" alt="star.art">
    </a>

    <section class="caixa">
      <a class="voltar" href="index.html">
        <img src="assets/imgs/iconback.png" alt="Voltar para a página inicial">
      </a>

      <h1>Faça login</h1>

      <form action="#" method="post">
        <label for="email">Email<span>*</span></label>
        <input type="email" id="email" name="email" placeholder="seuemail@.com" required>

        <label for="senha">Senha<span>*</span></label>
        <input type="password" id="senha" name="senha" placeholder="suasenha1234" required>

        <button type="submit">Entrar</button>
      </form>

      <p class="cadastro">Não tem uma conta? <a href="cadastro.html">Cadastre-se agora</a></p>
    </section>

  </main>

</body>

</html>
