<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="assets/icon/favicon2.png">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/dashboards.css">
</head>

<body>

  <header class="navbar">
    <div class="avatar" aria-hidden="true"><i class="fa-solid fa-user"></i></div>
    <span class="greeting" id="greeting">Olá,</span>
    <span class="nav-spacer"></span>
    <a class="nav-link"></a>
    <a class="nav-link" href="homepage.html">Explorar</a>
    <a class="btn-exit" href="index.html">Sair</a>
  </header>

  <main>
    <section class="stats" aria-label="Resumo">
      <div class="stat">
        <h2><img class="kpi-icon" src="assets/icon/respondidos_icon.png" alt="" >Assuntos respondidos</h2>
        <div class="value" id="statStudied">–</div>
      </div>

      <div class="stat">
        <h2><img class="kpi-icon" src="assets/icon/avaliações_icon.png" alt="">Quizzes realizados</h2>
        <div class="value" id="statAttempts">–</div>
      </div>

      <div class="stat">
        <h2><img class="kpi-icon" src="assets/icon/Acertos_icon.png" alt="">Média de acertos</h2>
        <p class="sub">Média de todos os quizzes feitos</p>
        <div class="value" id="statAverage">–</div>
      </div>
    </section>

    <section class="panels">
      <div class="card chart-card">
        <h3>Média de acertos por assunto</h3>
        <p class="sub">Tentativas de cada assunto</p>
        <div class="chart-wrap">
          <canvas id="chartModules" role="img"
            aria-label="Gráfico de barras com a média de aproveitamento por módulo"></canvas>
        </div>
      </div>

      <div class="card modules">
        <h4>Estado dos módulos</h4>
        <div id="modulesList"></div>
        <button class="btn-start" type="button" id="btnStart"></button>
      </div>
    </section>
  </main>

  <span class="version-tag">V1.0.0</span>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
