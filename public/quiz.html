<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icon/favicon2.png">
  <title>Quiz · Star.Art</title>
  <link rel="stylesheet" href="css/quiz.css">
</head>

<body>

  <main class="quiz">

    <nav class="quiz-nav">
      <a class="quiz-brand">
        <img class="quiz-brand-logo" src="assets/imgs/logoWhite.png" alt="Star.Art">
        <em>·</em> Quiz
      </a>
      <div class="quiz-nav-links">
        <a href="homepage.html">
          <img class="quiz-nav-icon" src="assets/icon/home_icon.png" alt="">
          Homepage
        </a>
        <a href="dashboard.html">
          <img class="quiz-nav-icon" src="assets/icon/dashboard_icon.png" alt="">
          Dashboard
        </a>
      </div>
    </nav>

    <section id="telaMenu">
      <p class="eyebrow">Módulo de estudo</p>
      <h1>Escolha um quiz</h1>
      <p class="instrucao">Cada quiz tem 5 perguntas. O feedback aparece a cada resposta.</p>
      <div id="listaQuizzes"></div>
    </section>

    <section id="telaPergunta" hidden>
      <div class="topo">
        <span id="tituloQuiz"></span>
        <span id="contador"></span>
      </div>

      <h1 id="pergunta"></h1>
      <p class="instrucao">Selecione a alternativa correta.</p>

      <div id="alternativas"></div>

      <div id="feedback" class="feedback" hidden>
        <strong id="feedbackTitulo"></strong>
        <p id="feedbackTexto"></p>
      </div>

      <button id="botaoConfirmar" class="botao" disabled>Confirmar resposta</button>
    </section>

    <section id="telaResultado" hidden>
      <p class="eyebrow">Resultado</p>
      <h1>Quiz finalizado</h1>
      <p class="instrucao" id="textoResultado"></p>
      <p class="nota" id="notaResultado"></p>

      <div class="acoes">
        <button id="botaoRepetir" class="botao">Tentar de novo</button>
        <button id="botaoMenu" class="botao secundario">Voltar aos quizzes</button>
      </div>
    </section>

  </main>

  <script src="js/quiz-data.js"></script>
  <script src="js/quiz.js"></script>
</body>

</html>
